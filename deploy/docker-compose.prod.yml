name: 1toufang

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-one_toufang}
      POSTGRES_USER: ${POSTGRES_USER:-one_toufang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      API_URL: ${API_URL:-https://wzzads.com}
      WEB_URL: ${WEB_URL:-https://wzzads.com}
      WEB_URLS: ${WEB_URLS:-https://wzzads.com,http://wzzads.com}
      DATABASE_URL: postgresql://${POSTGRES_USER:-one_toufang}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-one_toufang}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_API_BASE_URL: ${META_API_BASE_URL:-https://graph.facebook.com}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v25.0}
      META_REDIRECT_URI: ${META_REDIRECT_URI:-https://wzzads.com/api/integrations/meta/callback}
      META_SCOPES: ${META_SCOPES:-ads_management,ads_read,business_management,pages_read_engagement}
      TIKTOK_APP_ID: ${TIKTOK_APP_ID:-}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
      TIKTOK_AUTH_URL: ${TIKTOK_AUTH_URL:-https://business-api.tiktok.com/portal/auth}
      TIKTOK_API_BASE_URL: ${TIKTOK_API_BASE_URL:-https://business-api.tiktok.com}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-https://wzzads.com/api/integrations/tiktok/callback}
      TIKTOK_SCOPES: ${TIKTOK_SCOPES:-user.info.basic,biz.ad}
      PUBLISH_DRY_RUN: ${PUBLISH_DRY_RUN:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@wzzads.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_EMPLOYEE_NO: ${SEED_ADMIN_EMPLOYEE_NO:-TF000001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
